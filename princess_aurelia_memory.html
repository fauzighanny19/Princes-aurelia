
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Aurelia's Memories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fce4ec;
            color: #d81b60;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            font-size: 3em;
            margin-top: 20px;
        }
        .container {
            margin-top: 50px;
        }
        input {
            font-size: 1.5em;
            padding: 10px;
            width: 60%;
            margin-top: 20px;
            border-radius: 10px;
            border: 1px solid #d81b60;
            outline: none;
        }
        input:focus {
            border-color: #ff4081;
        }
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 50px;
        }
        iframe {
            width: 640px;
            height: 360px;
            margin-top: 20px;
            border: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Welcome, Princess Aurelia</h1>
    <div class="container">
        <p>Masukkan nama rahasia untuk membuka kenangan kami.</p>
        <input type="text" id="nameInput" placeholder="Masukkan nama..." />
        <button onclick="unlockMemory()">Unlock</button>
    </div>
    
    <div class="hidden" id="gallery">
        <h2>Kenangan Kami 💖</h2>
        <iframe src="https://drive.google.com/file/d/13Xft_nDe7RLIad_vypkDfr-5HC2OcV7b/preview" allow="autoplay"></iframe>
        <div style="margin-top: 20px; font-size: 24px; color: #ff66b2;">
            <p>Gimana buat hari ini, apakah full happy?</p>
        </div>
    </div>

    <script>
        function unlockMemory() {
            var name = document.getElementById('nameInput').value.toLowerCase();
            if (name === 'princes aurelia') {
                document.getElementById('gallery').classList.remove('hidden');
                document.getElementById('nameInput').style.display = 'none';
                document.querySelector('button').style.display = 'none';
            } else {
                alert("Coba lagi ya, sayang 💖");
            }
        }
    </script>
</body>
</html>
